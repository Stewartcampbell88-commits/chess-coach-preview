<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#262421" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chess - Teacher" />
  <title>Chess - Teacher</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <style>
    :root {
      --bg: #262421;
      --bg-deep: #1a1917;
      --surface: #302e2c;
      --surface-2: #3a3733;
      --green: #81b64c;
      --green-bright: #95c75c;
      --green-deep: #5d8a35;
      --green-soft: rgb(129 182 76 / 0.18);
      --coral: #e57373;
      --coral-soft: rgb(229 115 115 / 0.16);
      --text: #ffffff;
      --muted: #a3a3a0;
      --border: #3d3b38;
      --light-sq: #eeeed2;
      --dark-sq: #769656;
      --hi: #f5f682;
      --hi-ok: #baca44;
      --hi-bad: #e57373;
      --lock: #6b6965;
      --radius: 10px;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }
    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:not(:disabled):active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; }
    #app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: max(0.75rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    .chrome-meta { min-width: 0; }
    .chrome-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .mastery {
      margin-top: 0.4rem;
      height: 4px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      width: 9rem;
      max-width: 40vw;
    }
    .mastery > i {
      display: block;
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      width: 0%;
      transition: width 0.35s ease;
    }
    .hearts {
      display: flex;
      gap: 0.2rem;
      font-size: 1.15rem;
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--coral);
    }
    .hearts .empty { color: #4a4844; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
    }
    .card.warn { background: var(--coral-soft); border-color: rgb(229 115 115 / 0.35); }
    .card.ok { background: var(--green-soft); border-color: rgb(129 182 76 / 0.4); }
    .card.clear {
      background: var(--surface);
      border: 1px solid rgb(129 182 76 / 0.45);
      text-align: center;
      padding: 1.75rem 1.25rem;
    }
    .clear-check {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 0.75rem;
      border-radius: 50%;
      background: var(--green);
      color: #1a1917;
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.25rem;
      color: var(--text);
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 750;
      margin: 0 0 0.5rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    p { margin: 0; line-height: 1.45; }
    .muted { color: var(--muted); }
    .small { font-size: 0.875rem; }
    .tiny {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .banner {
      background: var(--coral-soft);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      margin: 0.85rem 0 1rem;
      line-height: 1.4;
      border: 1px solid rgb(229 115 115 / 0.3);
    }
    .spacer { flex: 1; min-height: 1rem; }
    .cta {
      width: 100%;
      min-height: 3rem;
      border-radius: var(--radius);
      background: var(--green);
      color: #1a1917;
      font-weight: 750;
      font-size: 1.02rem;
      padding: 0.85rem 1rem;
      margin-top: 0.5rem;
    }
    .cta:not(:disabled):hover { background: var(--green-bright); }
    .cta.secondary {
      background: var(--surface);
      color: var(--text);
      box-shadow: inset 0 0 0 1.5px var(--border);
    }
    .cta.secondary:not(:disabled):hover { background: var(--surface-2); }
    .cta.ghost {
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      min-height: 2.5rem;
      margin-top: 0.25rem;
    }
    .cta.play-node {
      width: auto;
      min-height: 2.25rem;
      padding: 0.45rem 1rem;
      margin: 0;
      font-size: 0.9rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .chip {
      min-height: 2.75rem;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--border);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }
    .chip.on {
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1.5px var(--green);
      color: var(--green-bright);
    }
    .chip.correct-flash {
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1.5px var(--green);
    }
    .chip.wrong-flash {
      background: var(--coral-soft);
      box-shadow: inset 0 0 0 1.5px var(--coral);
    }

    /* ——— Board ——— */
    .board-wrap {
      margin: 0.85rem 0 0.35rem;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1917;
      box-shadow:
        0 0 0 2px #1a1917,
        0 0 0 4px #4a4844,
        0 10px 28px rgb(0 0 0 / 0.35);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      padding: 3px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 100%;
      height: 100%;
      border-radius: 5px;
      overflow: hidden;
      container-type: size;
    }
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      line-height: 1;
      cursor: pointer;
      font-size: 0;
    }
    .sq.light { background: var(--light-sq); }
    .sq.dark { background: var(--dark-sq); }
    .sq.hi { box-shadow: inset 0 0 0 0; background: var(--hi); }
    .sq.dark.hi { background: #baca44; }
    .sq.picked { box-shadow: inset 0 0 0 3.5px var(--green); background: var(--hi-ok); }
    .sq.dark.picked { background: #a3b83a; }
    .sq.legal { box-shadow: inset 0 0 0 3px var(--green-deep); }
    .sq.legal::after {
      content: "";
      position: absolute;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgb(93 138 53 / 0.65);
      pointer-events: none;
    }
    .sq.legal.has-piece::after {
      width: auto; height: auto; inset: 10%;
      border: 2.5px solid rgb(93 138 53 / 0.85);
      background: transparent;
      border-radius: 50%;
    }
    .sq .coord {
      position: absolute;
      font-size: 0.5rem;
      font-weight: 700;
      color: rgb(118 150 86 / 0.85);
      pointer-events: none;
      line-height: 1;
      z-index: 1;
    }
    .sq.dark .coord { color: rgb(238 238 210 / 0.75); }
    .sq .coord.file { bottom: 1px; right: 2px; }
    .sq .coord.rank { top: 1px; left: 2px; }
    .sq .piece {
      display: block;
      font-size: 62cqmin;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .piece-w {
      color: #FFFEF8;
      -webkit-text-stroke: 0.55px #1a1a1a;
      paint-order: stroke fill;
      text-shadow:
        0 0 0.5px #111,
        0 1px 0 #2a2a2a,
        0 1.5px 2px rgb(0 0 0 / 0.4);
    }
    .piece-b {
      color: #1a1a18;
      -webkit-text-stroke: 0.4px #0a0a0a;
      paint-order: stroke fill;
      text-shadow:
        0 0 0.5px #000,
        0 1px 0 rgb(255 255 255 / 0.2),
        0 1.5px 2px rgb(0 0 0 / 0.25);
    }

    .coach {
      font-size: 1rem;
      line-height: 1.5;
      margin: 0.15rem 0 0;
    }
    .tip {
      margin-top: 0.75rem;
      padding: 0.7rem 0.85rem;
      background: var(--green-soft);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.4;
      border: 1px solid rgb(129 182 76 / 0.25);
    }
    .tip strong { color: var(--green-bright); font-weight: 700; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.35rem;
    }
    .home-hero { padding-top: 0.85rem; padding-bottom: 0.35rem; }
    .goal-line {
      font-size: 0.95rem;
      font-weight: 650;
      color: var(--green-bright);
      margin: 0.3rem 0 0;
    }
    .overall-bar {
      margin: 0.85rem 0 0.35rem;
      height: 8px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .overall-bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--green-deep), var(--green));
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .overall-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--muted);
    }

    /* ——— Lessons-style path ——— */
    .path {
      position: relative;
      margin: 0.5rem 0 0.25rem;
      padding: 0.25rem 0 0.5rem;
    }
    .path-spine {
      position: absolute;
      left: 1.55rem;
      top: 2rem;
      bottom: 2rem;
      width: 4px;
      background: var(--surface-2);
      border-radius: 99px;
      z-index: 0;
    }
    .path-spine > i {
      display: block;
      width: 100%;
      background: var(--green);
      border-radius: 99px;
      height: 0%;
      transition: height 0.4s ease;
    }
    .path-node {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 3.25rem 1fr;
      gap: 0.85rem;
      align-items: center;
      margin-bottom: 1.15rem;
    }
    .path-node:last-child { margin-bottom: 0; }
    .node-circle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
    .node-circle {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.15rem;
      background: var(--surface-2);
      color: var(--lock);
      border: 3px solid #4a4844;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.25);
    }
    .path-node.done .node-circle {
      background: var(--green);
      color: #1a1917;
      border-color: var(--green-bright);
    }
    .path-node.current .node-circle {
      background: var(--surface);
      color: var(--green-bright);
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgb(129 182 76 / 0.25), 0 4px 14px rgb(0 0 0 / 0.3);
    }
    .path-node.locked .node-circle {
      background: #2a2826;
      color: var(--lock);
      border-color: #3d3b38;
    }
    .node-stars {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: #f0c040;
      line-height: 1;
      min-height: 0.7rem;
    }
    .node-stars .empty-star { color: #4a4844; }
    .node-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 0.85rem;
      min-width: 0;
    }
    .path-node.current .node-body {
      border-color: rgb(129 182 76 / 0.55);
      background: #35332f;
    }
    .path-node.locked .node-body {
      opacity: 0.55;
    }
    .path-node.done .node-body {
      border-color: rgb(129 182 76 / 0.3);
    }
    .node-title {
      font-weight: 750;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .node-blurb {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0.2rem 0 0;
      line-height: 1.35;
    }
    .node-actions {
      margin-top: 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lock-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--lock);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .tag-list { margin: 0.75rem 0 0; padding: 0; list-style: none; }
    .tag-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .tag-list li:last-child { border-bottom: 0; }
    .note-soft {
      margin: 0.75rem 0;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      border: 1px solid var(--border);
    }
    .hide { display: none !important; }
    .foot-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 1.25rem;
    }
    .stars {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      color: #f0c040;
      margin: 0.65rem 0 0.35rem;
    }
    .stars .empty-star { color: #4a4844; }
    .timer-bar {
      margin: 0.65rem 0 0.25rem;
      height: 5px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .timer-bar > i {
      display: block;
      height: 100%;
      background: var(--coral);
      border-radius: 99px;
      width: 100%;
      transition: width 0.2s linear;
    }
    .timer-bar.ok > i { background: var(--green); }
    .timer-label {
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--muted);
      text-align: right;
    }
    .update-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      background: var(--green-soft);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0.75rem 0.9rem;
      font-size: 0.9rem;
      margin: 0.85rem 0 0.75rem;
      line-height: 1.4;
      border: 1px solid rgb(129 182 76 / 0.35);
    }
    .update-banner strong { font-weight: 700; }
    .update-banner .cta {
      width: auto;
      min-height: 2.5rem;
      margin-top: 0;
      padding: 0.55rem 0.95rem;
      font-size: 0.95rem;
    }
    .update-card .cta {
      min-height: 2.75rem;
      font-size: 0.95rem;
      margin-top: 0.65rem;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.4);
      z-index: 40;
      max-width: min(20rem, calc(100vw - 2rem));
      font-size: 0.875rem;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast hide" role="status" aria-live="polite"></div>
  <script>
(function () {
  const APP_VERSION = "chess-coach-v5";
  const FILES = "abcdefgh";
  const PIECES_SHOW = {
    K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙",
    k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟",
  };

  // Schema bump — fresh progress OK; migrate from v4 if present.
  const STORAGE_KEY = "chess-teacher-v5";
  const PREV_STORAGE_KEY = "chess-teacher-v4";

  function emptyBoard() {
    const b = {};
    for (let r = 1; r <= 8; r++) for (const f of FILES) b[f + r] = null;
    return b;
  }
  function place(map) {
    const b = emptyBoard();
    Object.entries(map || {}).forEach(([k, v]) => { b[k] = v; });
    return b;
  }
  function fromFen(fen) {
    const b = emptyBoard();
    const [rows] = fen.split(" ");
    const ranks = rows.split("/");
    for (let ri = 0; ri < 8; ri++) {
      const rank = 8 - ri;
      let file = 0;
      for (const ch of ranks[ri]) {
        if (/\d/.test(ch)) file += parseInt(ch, 10);
        else {
          b[FILES[file] + rank] = ch;
          file++;
        }
      }
    }
    return b;
  }

  // White system choice: Italian-ish (e4 + Nf3 + Bc4). Same shapes Stewart faces as Black.
  const WHITE_SYSTEM = "italian";

  const LEVELS = [
    {
      id: 1,
      name: "Don't Hang Stuff",
      short: "Hangs",
      tags: ["hanging", "cct"],
      blurb: "Stop giving pieces away for free.",
      unlockTease: "Next up: Survive the Italian.",
    },
    {
      id: 2,
      name: "Survive the Italian",
      short: "Italian",
      tags: ["italian", "fried-liver"],
      blurb: "Watch Ng5 — don't let Nxf7 cook your king.",
      unlockTease: "Next up: One White System.",
    },
    {
      id: 3,
      name: "One White System",
      short: "White",
      tags: ["white-system", "italian-white"],
      blurb: "e4 → Nf3 → Bc4. One reliable start.",
      unlockTease: "Next up: Clock Habits.",
    },
    {
      id: 4,
      name: "Clock Habits",
      short: "Clock",
      tags: ["clock", "habits"],
      blurb: "Leave time. Glance for hangs. Resign cleanly.",
      unlockTease: "Ladder clear — keep the habits warm.",
    },
  ];

  const CARDS = [
    // ——— Level 1: Don't Hang Stuff ———
    {
      id: "l1-teach-hang",
      level: 1,
      type: "teach",
      tag: "hanging",
      title: "What is hanging?",
      coach: "A piece is hanging when it's attacked and not safely defended. Free lunch — take it if it's safe. Your Rapid leaks start here.",
      board: fromFen("4k3/8/8/4q3/8/8/4N3/4K3 w"),
      highlight: ["e5", "e2"],
      tip: "Before every move, ask: what did I leave hanging?",
    },
    {
      id: "l1-drill-attacks",
      level: 1,
      type: "drill",
      mode: "multi-tap",
      tag: "cct",
      title: "Tap every square this knight attacks",
      prompt: "White knight on e4. Empty board — tap all eight L-squares, then Submit. (Don't tap e4 itself.)",
      board: place({ e4: "N" }),
      accept: ["d6", "f6", "c5", "g5", "c3", "g3", "d2", "f2"],
      lockedSquares: ["e4"],
      explainOk: "Those eight L-squares are the knight's whole reach from e4. Attacks first — CCT habit.",
      explainBad: "From e4 a knight hits d6, f6, c5, g5, c3, g3, d2 and f2 — not its own square.",
    },
    {
      id: "l1-drill-hang-tap",
      level: 1,
      type: "drill",
      mode: "tap-piece",
      tag: "hanging",
      title: "Tap the hanging piece",
      prompt: "White to move. Which black piece is hanging?",
      board: fromFen("4k3/8/8/4q3/8/8/4N3/4K3 w"),
      accept: ["e5"],
      followCapture: { from: "e2", to: "e5", piece: "N" },
      explainOk: "The queen on e5 is attacked by the knight and nothing defends her. Nxe5 wins her.",
      explainBad: "Look for the black queen on e5 — the knight on e2 attacks her, and she's undefended.",
    },
    {
      id: "l1-drill-mcq",
      level: 1,
      type: "drill",
      mode: "mcq",
      tag: "hanging",

  function cardsForLevel(levelId) {
    return CARDS.filter((c) => c.level === levelId);
  }

  function levelMeta(id) {
    return LEVELS.find((l) => l.id === id) || LEVELS[0];
  }

  function defaultStars() {
    return { 1: 0, 2: 0, 3: 0, 4: 0 };
  }

  function loadState() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const prev = localStorage.getItem(PREV_STORAGE_KEY);
        if (prev) {
          try {
            const migrated = JSON.parse(prev) || {};
            if (!migrated.levelStars) migrated.levelStars = defaultStars();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            raw = localStorage.getItem(STORAGE_KEY);
          } catch {}
        }
      }
      return JSON.parse(raw || "{}") || {};
    } catch {
      return {};
    }
  }
  function saveState(partial) {
    const next = { ...loadState(), ...partial };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    return next;
  }

  const state = {
    screen: "home",
    level: 1,
    maxUnlocked: 1,
    hearts: 3,
    cardIndex: 0,
    mastery: 0,
    picks: new Set(),
    selected: null,
    feedback: null,
    struggleTags: [],
    sessionWrong: [],
    sessionDone: false,
    hangingStep: 0,
    levelNoteShown: false,
    timerLeft: 0,
    timerTotal: 0,
    timerExpired: false,
    levelStars: defaultStars(),
    lastClearStars: 0,
  };

  let timerInterval = null;

  const ui = {
    swReg: null,
    updateReady: false,
    updateChecking: false,
    refreshing: false,
    toastTimer: null,
    appVersion: APP_VERSION,
  };

  function hydrate() {
    const s = loadState();
    if (typeof s.level === "number" && s.level >= 1 && s.level <= 4) state.level = s.level;
    if (typeof s.maxUnlocked === "number" && s.maxUnlocked >= 1) state.maxUnlocked = Math.min(4, s.maxUnlocked);
    if (state.level > state.maxUnlocked) state.level = state.maxUnlocked;
    if (Array.isArray(s.struggleTags)) state.struggleTags = s.struggleTags;
    state.levelStars = { ...defaultStars(), ...(s.levelStars || {}) };
  }

  function starsHtml(n, max = 3) {
    let out = "";
    for (let i = 1; i <= max; i++) {
      out += i <= n ? "★" : '<span class="empty-star">★</span>';
    }
    return out;
  }

  function clearedCount() {
    const clearedAll = loadState().ladderClear === true;
    if (clearedAll) return 4;
    return Math.max(0, state.maxUnlocked - 1);
  }

  function hotStruggle() {
    return state.struggleTags[0] || null;
  }

  function tagLabel(tag) {
    const map = {
      hanging: "Hanging pieces",
      cct: "Checks · Captures · Threats",
      italian: "Italian / Ng5",
      "fried-liver": "Fried Liver",
      "white-system": "White system",
      "italian-white": "Italian as White",
      clock: "Clock habits",
      habits: "Pre-move glance",
    };
    return map[tag] || tag;
  }

  function sessionCards() {
    return cardsForLevel(state.level);
  }

  function currentCard() {
    const list = sessionCards();
    return list[state.cardIndex] || null;
  }

  function masteryPct() {
    const list = sessionCards();
    if (!list.length) return 0;
    return Math.round((state.cardIndex / list.length) * 100);
  }

  function clearTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function startSoftTimer(sec) {
    clearTimer();
    state.timerTotal = sec;
    state.timerLeft = sec;
    state.timerExpired = false;
    timerInterval = setInterval(() => {
      state.timerLeft = Math.max(0, state.timerLeft - 0.2);
      if (state.timerLeft <= 0) {
        state.timerLeft = 0;
        state.timerExpired = true;
        clearTimer();
      }
      // Soft refresh of timer UI only when on drill
      const bar = document.querySelector(".timer-bar > i");
      const label = document.querySelector(".timer-label");
      if (bar && state.timerTotal) {
        const pct = (state.timerLeft / state.timerTotal) * 100;
        bar.style.width = pct + "%";
        const wrap = bar.parentElement;
        if (wrap) wrap.classList.toggle("ok", state.timerLeft > state.timerTotal * 0.35);
      }
      if (label) label.textContent = Math.ceil(state.timerLeft) + "s";
    }, 200);
  }

  // ——— Board render ———
  function renderBoard(board, opts = {}) {
    const {
      highlight = [],
      picked = [],
      legalHints = [],
      interactive = false,
      showCoords = true,
    } = opts;
    const hi = new Set(highlight);
    const pk = new Set(picked);
    const legal = new Set(legalHints);
    let html = '<div class="board-wrap"><div class="board" role="grid" aria-label="Chess board">';
    for (let rank = 8; rank >= 1; rank--) {
      for (let fi = 0; fi < 8; fi++) {
        const file = FILES[fi];
        const name = file + rank;
        const isLight = (fi + rank) % 2 === 1;
        const piece = board[name];
        const classes = ["sq", isLight ? "light" : "dark"];
        if (hi.has(name)) classes.push("hi");
        if (pk.has(name)) classes.push("picked");
        if (legal.has(name)) classes.push("legal");
        if (piece) classes.push("has-piece");
        let coords = "";
        if (showCoords) {
          if (rank === 1) coords += `<span class="coord file">${file}</span>`;
          if (fi === 0) coords += `<span class="coord rank">${rank}</span>`;
        }
        let pieceHtml = "";
        if (piece) {
          const isWhite = piece === piece.toUpperCase();
          pieceHtml = `<span class="piece ${isWhite ? "piece-w" : "piece-b"}">${PIECES_SHOW[piece]}</span>`;
        }
        const data = interactive ? ` data-sq="${name}"` : "";
        html += `<div class="${classes.join(" ")}"${data}>${coords}${pieceHtml}</div>`;
      }
    }
    html += "</div></div>";
    return html;
  }

  function chromeHtml() {
    const hearts = [0, 1, 2].map((i) =>
      `<span class="${i < state.hearts ? "" : "empty"}">${i < state.hearts ? "♥" : "♡"}</span>`
    ).join("");
    const meta = levelMeta(state.level);
    const pct = Math.max(state.mastery, masteryPct());
    return `
      <div class="chrome">
        <div class="chrome-meta">
          <div class="chrome-label">Level ${state.level} · ${meta.name}</div>
          <div class="mastery" aria-hidden="true"><i style="width:${pct}%"></i></div>
        </div>
        <div class="hearts" aria-label="${state.hearts} hearts left">${hearts}</div>
      </div>`;
  }

  function softToast(msg, desc) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = desc ? `${msg} — ${desc}` : msg;
    el.classList.remove("hide");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.add("hide"), 2800);
  }

  async function applyUpdate() {
    const reg = ui.swReg || (await navigator.serviceWorker.getRegistration());
    const waiting = reg && reg.waiting;
    if (waiting) {
      ui.refreshing = true;
      waiting.postMessage({ type: "SKIP_WAITING" });
      setTimeout(() => location.reload(), 1500);
      return;
    }
    try { await reg?.update(); } catch {}
    location.reload();
  }

  async function checkForUpdate() {
    if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) {
      softToast("Updates need the web app", "Open the GitHub Pages link, not a downloaded file.");
      return;
    }
    ui.updateChecking = true;
    softToast("Checking…");
    render();
    try {
      const reg = ui.swReg || (await navigator.serviceWorker.getRegistration());
      if (!reg) {
        softToast("No service worker yet");
        ui.updateChecking = false;
        render();
        return;
      }
      await reg.update();
      await new Promise((r) => setTimeout(r, 600));
      const pending = Boolean(reg.waiting || (reg.installing && navigator.serviceWorker.controller));
      if (pending || ui.updateReady) {
        ui.updateReady = true;
        softToast("Update available");
      } else {
        softToast("You're on the latest");
      }
    } catch {
      softToast("Check failed");
    }
    ui.updateChecking = false;
    render();
  }

  function renderPath() {
    const clearedAll = loadState().ladderClear === true;
    const cleared = clearedCount();
    // Spine fill: how far along the 4 nodes
    const spinePct = clearedAll ? 100 : Math.max(0, ((cleared) / 3) * 100);
    const nodes = LEVELS.map((l) => {
      const isLocked = l.id > state.maxUnlocked;
      const isDone = l.id < state.maxUnlocked || (clearedAll && l.id <= 4);
      const isCurrent = !isLocked && !isDone && l.id === state.maxUnlocked;
      // Also treat selected/current playable as current highlight when equal to maxUnlocked
      let cls = "path-node";
      if (isLocked) cls += " locked";
      else if (isDone) cls += " done";
      else cls += " current";

      const best = state.levelStars[l.id] || 0;
      const circleInner = isLocked
        ? "🔒"
        : isDone
          ? "✓"
          : String(l.id);
      const starsRow = (!isLocked && (isDone || best > 0))
        ? `<div class="node-stars" aria-label="${best} stars">${starsHtml(best)}</div>`
        : `<div class="node-stars" aria-hidden="true"></div>`;

      let actions = "";
      if (isLocked) {
        actions = `<div class="lock-badge"><span>🔒</span> Locked</div>`;
      } else if (isDone) {
        actions = `<button class="cta play-node secondary" data-action="play-level" data-level="${l.id}">Replay</button>`;
      } else {
        actions = `<button class="cta play-node" data-action="play-level" data-level="${l.id}">Play</button>`;
      }

      return `
        <div class="${cls}">
          <div class="node-circle-wrap">
            <div class="node-circle" aria-hidden="true">${circleInner}</div>
            ${starsRow}
          </div>
          <div class="node-body">
            <p class="node-title">Level ${l.id} · ${l.name}</p>
            <p class="node-blurb">${l.blurb}</p>
            <div class="node-actions">${actions}</div>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="path">
        <div class="path-spine" aria-hidden="true"><i style="height:${spinePct}%"></i></div>
        ${nodes}
      </div>`;
  }

  function renderDrill(card) {
    const picked = [...state.picks];
    let body = "";
    if (card.mode === "multi-tap") {
      body = `
        ${renderBoard(card.board, {
          interactive: true,
          picked,
          highlight: [],
        })}
        <p class="muted small" style="margin-top:0.5rem">${picked.length} selected</p>
        <button class="cta" data-action="submit-multi" ${picked.length ? "" : "disabled"}>Submit</button>
        <button class="cta ghost" data-action="clear-picks">Clear</button>`;
    } else if (card.mode === "mcq") {
      const chips = card.options
        .map(
          (o) =>
            `<button class="chip ${state.selected === o ? "on" : ""}" data-action="pick-mcq" data-value="${o.replace(/"/g, "&quot;")}">${o}</button>`
        )
        .join("");
      body = `
        ${renderBoard(card.board, { highlight: [] })}
        <div class="chips">${chips}</div>
        <button class="cta" data-action="submit-mcq" ${state.selected ? "" : "disabled"}>Submit</button>`;
    } else if (card.mode === "tap-piece" || card.mode === "timed-tap") {
      const timerHtml = card.mode === "timed-tap"
        ? `<div class="timer-bar ${state.timerLeft > state.timerTotal * 0.35 ? "ok" : ""}"><i style="width:${state.timerTotal ? (state.timerLeft / state.timerTotal) * 100 : 100}%"></i></div>
           <p class="timer-label">${Math.ceil(state.timerLeft)}s</p>`
        : "";
      if (state.hangingStep === 0) {
        body = `
          ${timerHtml}
          ${renderBoard(card.board, {
            interactive: true,
            picked,
            highlight: [],
          })}
          <button class="cta" data-action="submit-tap" ${picked.length ? "" : "disabled"}>That’s the one</button>`;
      } else {
        const after = { ...card.board };
        body = `
          ${renderBoard(after, {
            highlight: [card.followCapture.from, card.followCapture.to],
            legalHints: [card.followCapture.to],
            interactive: true,
          })}
          <p class="coach" style="margin-top:0.6rem">Take it.</p>
          <button class="cta" data-action="do-capture">Take it</button>`;
      }
    }
    return `
      ${chromeHtml()}
      <p class="tiny">Drill</p>
      <h2>${card.title}</h2>
      <p class="muted small">${card.prompt}</p>
      ${body}`;
  }

  function renderFeedback() {
    const fb = state.feedback;
    const cls = fb.ok ? "ok" : "warn";
    const head = fb.ok ? "That’s it" : "Not quite";
    const note = fb.rungNote
      ? `<div class="note-soft">${fb.rungNote}</div>`
      : "";
    return `
      ${chromeHtml()}
      <div class="card ${cls}">
        <p class="tiny">${head}</p>
        <p class="coach">${fb.explain}</p>
      </div>
      ${note}
      <div class="spacer"></div>
      <button class="cta" data-action="next">Next</button>`;
  }

  function renderLevelClear() {
    const meta = levelMeta(state.level);
    const nextId = state.level + 1;
    const next = nextId <= 4 ? levelMeta(nextId) : null;
    const earned = state.lastClearStars || 0;
    const tease = next
      ? `<p class="muted" style="margin-top:0.65rem">Unlocked: <strong>Level ${next.id} — ${next.name}</strong></p>`
      : `<p class="muted" style="margin-top:0.65rem">Path clear. Keep the habits warm toward 1500 Rapid.</p>`;
    return `
      <div class="card clear" style="margin-top:1.5rem">
        <div class="clear-check" aria-hidden="true">✓</div>
        <p class="tiny">Level clear</p>
        <div class="stars" aria-label="${earned} stars">${starsHtml(earned)}</div>
        <h1>Level ${meta.id} clear</h1>
        <p class="coach" style="margin-top:0.35rem">${meta.name}</p>
        <p class="muted small" style="margin-top:0.35rem">${earned} star${earned === 1 ? "" : "s"} this run</p>
        ${tease}
      </div>
      <div class="spacer"></div>
      ${next
        ? `<button class="cta" data-action="play-next">Next level</button>
           <button class="cta ghost" data-action="done">Back home</button>`
        : `<button class="cta" data-action="done">Done</button>`}`;
  }

  function renderSessionEnd() {
    // Soft fail / incomplete — stay on level
    const meta = levelMeta(state.level);
    const due = state.sessionWrong.length
      ? state.sessionWrong.slice(0, 2)
      : meta.tags.slice(0, 2);
    const uniqueDue = [...new Set(due)].slice(0, 2);
    const tags = uniqueDue
      .map((t) => `<li><span>${tagLabel(t)}</span><span class="muted small">revisit</span></li>`)
      .join("");
    return `
      <p class="tiny">Session</p>
      <h1>Keep going</h1>
      <p class="muted">Still on Level ${state.level} — ${meta.name}.</p>
      <div class="card" style="margin-top:1rem">
        <p class="tiny">Worth another look</p>
        <ul class="tag-list">${tags}</ul>
      </div>
      <div class="spacer"></div>
      <button class="cta" data-action="done">Back home</button>`;
  }

  function render() {
    const root = document.getElementById("app");
    let html = "";
    if (state.screen === "home") html = renderHome();
    else if (state.screen === "teach") html = renderTeach(currentCard());
    else if (state.screen === "drill") html = renderDrill(currentCard());
    else if (state.screen === "feedback") html = renderFeedback();
    else if (state.screen === "clear") html = renderLevelClear();
    else if (state.screen === "end") html = renderSessionEnd();
    root.innerHTML = html;
    bind();
  }

  function bind() {
    const root = document.getElementById("app");
    root.querySelectorAll("[data-action]").forEach((el) => {
      el.addEventListener("click", onAction);
    });
    root.querySelectorAll(".sq[data-sq]").forEach((el) => {
      el.addEventListener("click", onSquare);
    });
  }

  function startSession() {
    clearTimer();
    state.screen = "teach";
    state.hearts = 3;
    state.cardIndex = 0;
    state.mastery = 0;
    state.picks = new Set();
    state.selected = null;
    state.feedback = null;
    state.sessionWrong = [];
    state.sessionDone = false;
    state.hangingStep = 0;
    state.levelNoteShown = false;
    state.timerExpired = false;
    saveState({ hearts: 3, level: state.level, maxUnlocked: state.maxUnlocked });
    showCurrentCard();
  }

  function showCurrentCard() {
    const list = sessionCards();
    if (state.cardIndex >= list.length) {
      clearLevel();
      return;
    }
    const card = currentCard();
    state.picks = new Set();
    state.selected = null;
    state.hangingStep = 0;
    state.feedback = null;
    state.screen = card.type === "teach" ? "teach" : "drill";
    state.mastery = masteryPct();
    render();
    if (card.mode === "timed-tap" && card.timerSec) {
      startSoftTimer(card.timerSec);
    } else {
      clearTimer();
    }
  }

  function advanceAfterTeach() {
    state.cardIndex += 1;
    state.mastery = masteryPct();
    showCurrentCard();
  }

  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    const s = new Set(a);
    return b.every((x) => s.has(x));
  }

  function applyResult(ok, card) {
    clearTimer();
    let lostHeart = false;
    let rungNote = null;
    // Soft timer expiry: still allow answer, but wrong if expired without correct pick already judged
    if (card.mode === "timed-tap" && state.timerExpired && ok) {
      // answered after expiry — count as miss for clock habit
      ok = false;
      card = {
        ...card,
        explainBad: "Time's soft limit ran out — still tap the hang, but leave clock in real games. " + card.explainBad,
      };
    }
    if (!ok) {
      state.hearts = Math.max(0, state.hearts - 1);
      lostHeart = true;
      state.sessionWrong.push(card.tag);
      const tags = [card.tag, ...state.struggleTags.filter((t) => t !== card.tag)].slice(0, 4);
      state.struggleTags = tags;
      saveState({ struggleTags: tags, hearts: state.hearts });
      if (state.hearts === 0 && !state.levelNoteShown) {
        state.levelNoteShown = true;
        rungNote =
          "Hearts empty — soft retry. Stay on this level, refill hearts, and keep practising. No demotion in this preview.";
        state.hearts = 3;
        saveState({ hearts: 3 });
      }
    } else {
      saveState({ hearts: state.hearts });
    }
    state.feedback = {
      ok,
      explain: ok ? card.explainOk : card.explainBad,
      lostHeart,
      rungNote,
    };
    state.screen = "feedback";
    const list = sessionCards();
    state.mastery = Math.round(((state.cardIndex + 1) / list.length) * 100);
    render();
  }

  function clearLevel() {
    clearTimer();
    const cleared = state.level;
    // Stars from hearts left at clear: 3→3★, 2→2★, 1→1★ (0 shouldn't reach clear)
    const earned = Math.max(1, Math.min(3, state.hearts || 1));
    state.lastClearStars = earned;
    const prevBest = state.levelStars[cleared] || 0;
    if (earned > prevBest) {
      state.levelStars = { ...state.levelStars, [cleared]: earned };
    }
    const nextUnlock = Math.min(4, cleared + 1);
    if (nextUnlock > state.maxUnlocked) state.maxUnlocked = nextUnlock;
    const persist = {
      maxUnlocked: state.maxUnlocked,
      struggleTags: state.struggleTags,
      levelStars: state.levelStars,
    };
    if (cleared === 4) {
      persist.level = 4;
      persist.ladderClear = true;
      saveState(persist);
    } else {
      state.level = nextUnlock;
      persist.level = state.level;
      saveState(persist);
    }
    // Restore cleared level id for the clear screen copy
    state.level = cleared;
    state.screen = "clear";
    state.sessionDone = true;
    render();
  }

  function endSessionSoft() {
    clearTimer();
    state.screen = "end";
    state.sessionDone = true;
    const tags = state.sessionWrong.length
      ? [...new Set(state.sessionWrong)].slice(0, 2)
      : state.struggleTags.slice(0, 2);
    if (tags.length) {
      state.struggleTags = tags;
      saveState({ struggleTags: tags, level: state.level, maxUnlocked: state.maxUnlocked });
    }
    render();
  }

  function onAction(e) {
    const action = e.currentTarget.getAttribute("data-action");
    const card = currentCard();
    if (action === "play") {
      startSession();
      return;
    }
    if (action === "play-level") {
      const lvl = parseInt(e.currentTarget.getAttribute("data-level"), 10);
      if (!lvl || lvl < 1 || lvl > 4) return;
      if (lvl > state.maxUnlocked) return;
      state.level = lvl;
      saveState({ level: state.level, maxUnlocked: state.maxUnlocked });
      startSession();
      return;
    }
    if (action === "play-next") {
      const next = Math.min(4, (loadState().level || state.level));
      // After clear, persisted level is next unlock
      const s = loadState();
      state.level = s.level || Math.min(4, state.level + 1);
      startSession();
      return;
    }
    if (action === "got-it") {
      advanceAfterTeach();
      return;
    }
    if (action === "clear-picks") {
      state.picks = new Set();
      render();
      return;
    }
    if (action === "pick-mcq") {
      state.selected = e.currentTarget.getAttribute("data-value");
      render();
      return;
    }
    if (action === "submit-multi") {
      const ok = sameSet([...state.picks], card.accept);
      applyResult(ok, card);
      return;
    }
    if (action === "submit-mcq") {
      const ok = state.selected === card.answer;
      applyResult(ok, card);
      return;
    }
    if (action === "submit-tap") {
      const ok = [...state.picks].some((p) => card.accept.includes(p));
      if (ok && card.followCapture) {
        state.hangingStep = 1;
        state.picks = new Set();
        clearTimer();
        render();
        return;
      }
      applyResult(ok, card);
      return;
    }
    if (action === "do-capture") {
      applyResult(true, card);
      return;
    }
    if (action === "next") {
      state.cardIndex += 1;
      showCurrentCard();
      return;
    }
    if (action === "done") {
      clearTimer();
      // Sync level from storage (may have advanced on clear)
      const s = loadState();
      if (typeof s.level === "number") state.level = s.level;
      if (typeof s.maxUnlocked === "number") state.maxUnlocked = s.maxUnlocked;
      state.screen = "home";
      render();
      return;
    }
    if (action === "check-update") {
      checkForUpdate();
      return;
    }
    if (action === "apply-update") {
      applyUpdate();
    }
  }

  function onSquare(e) {
    const name = e.currentTarget.getAttribute("data-sq");
    const card = currentCard();
    if (!card || state.screen !== "drill") return;

    if (card.mode === "multi-tap") {
      // Do not toggle the side-to-move piece square being studied
      if (card.lockedSquares && card.lockedSquares.includes(name)) return;
      if (state.picks.has(name)) state.picks.delete(name);
      else state.picks.add(name);
      render();
      return;
    }
    if ((card.mode === "tap-piece" || card.mode === "timed-tap") && state.hangingStep === 0) {
      state.picks = new Set([name]);
      render();
      return;
    }
    if (card.mode === "tap-piece" && state.hangingStep === 1 && card.followCapture) {
      if (name === card.followCapture.to || name === card.followCapture.from) {
        applyResult(true, card);
      }
    }
  }

  // Boot
  hydrate();
  render();

  if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
    function watchInstalling(worker) {
      if (!worker) return;
      worker.addEventListener("statechange", () => {
        if (worker.state === "installed" && navigator.serviceWorker.controller) {
          ui.updateReady = true;
          render();
        }
      });
    }
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (ui.refreshing) return;
      ui.refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register(new URL("sw.js", location.href).href).then((reg) => {
      ui.swReg = reg;
      try { reg.update(); } catch {}
      reg.addEventListener("updatefound", () => watchInstalling(reg.installing));
      if (reg.waiting && navigator.serviceWorker.controller) {
        ui.updateReady = true;
        render();
      }
      watchInstalling(reg.installing);
    }).catch(() => {});
    const pokeUpdate = () => {
      if (document.visibilityState !== "visible") return;
      const reg = ui.swReg;
      if (reg && typeof reg.update === "function") {
        try { reg.update(); } catch {}
      }
    };
    document.addEventListener("visibilitychange", pokeUpdate);
    window.addEventListener("focus", pokeUpdate);
    setInterval(pokeUpdate, 60 * 60 * 1000);
  }
})();
  </script>
</body>
</html>
